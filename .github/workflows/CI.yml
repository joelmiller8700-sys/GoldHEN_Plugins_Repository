name: Build modules

on:
  push:
  workflow_dispatch:

jobs:
  build_prx:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/goldhen/goldhen_plugins_sdk:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build PRX
        run: make

      - name: Upload PRX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoldHEN_Plugins_PRX
          path: |
            **/*.prx
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtav_mod_menu
          path: |
            build/**/*.prx
